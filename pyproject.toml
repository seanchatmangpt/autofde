[project]
name = "autofde"
version = "0.1.0"
description = "AutoFDE Forward Deployment Operating System runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dspy>=3,<4",
  "fastmcp>=2.12,<3",
]

[project.scripts]
autofde-mcp = "autofde.mcp:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
