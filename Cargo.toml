[package]
name = "autofde"
version = "26.8.7"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "AutoFDE production process constitution and conformance kernel"
repository = "https://github.com/seanchatmangpt/autofde"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
