name: v26.9.1 independent runtime verification

on:
  pull_request:
    paths:
      - ".github/workflows/v26-9-1-independent-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mfw-cmca-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUBJECT_SHA: 2ecde02f9d7eaea50cfb4ea7876340c6463ac3a1
    steps:
      - name: Checkout release-control subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Materialize exact MFW subject
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/seanchatmangpt/mfw.git /tmp/mfw
          git -C /tmp/mfw checkout --detach "$SUBJECT_SHA"
          test "$(git -C /tmp/mfw rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Install exact MFW toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy
      - name: Execute MFW CMCA acceptance court
        working-directory: /tmp/mfw
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock
          cargo fmt --check -p mfw-cmca-bridge
          cargo check -p mfw-cmca-bridge --locked
          cargo test -p mfw-cmca-bridge --locked
          cargo clippy -p mfw-cmca-bridge --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          printf 'MFW_CMCA_CONSUMER_EXACT_SUBJECT_ALIVE=%s\n' "$SUBJECT_SHA"

  gymact-world-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUBJECT_SHA: 57c57318f56caad3a2fee166477410e38598e9f9
      GYMACT_ALLOW_DEGRADED_STANDINGS: "*"
    steps:
      - name: Checkout release-control subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Materialize exact GymAct subject
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/seanchatmangpt/gymact.git /tmp/gymact
          git -C /tmp/gymact checkout --detach "$SUBJECT_SHA"
          test "$(git -C /tmp/gymact rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install exact GymAct verification surface
        working-directory: /tmp/gymact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[gyms]' 'pytest>=8.3,<9' 'pytest-asyncio>=0.25,<2' 'rdflib>=7,<8'
      - name: Execute bounded world authority receipt replay court
        working-directory: /tmp/gymact
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -v \
            tests/test_dependency_world.py \
            tests/test_world_cyber_spy_vs_spy.py \
            tests/test_ggen_world_cyber_pack.py
          printf 'GYMACT_WORLD_EXECUTION_EXACT_SUBJECT_ALIVE=%s\n' "$SUBJECT_SHA"
