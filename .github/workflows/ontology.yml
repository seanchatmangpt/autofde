name: AutoFDE ontology crown

on:
  pull_request:
    paths:
      - "ontology/**"
      - "queries/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "generated/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "ggen.toml"
      - "Makefile"
      - ".github/workflows/ontology.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ontology-crown:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install bounded verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt
          python -m pip install --disable-pip-version-check --editable . "pytest>=8.4,<9"
      - name: Install exact ggen v26.8.6
        env:
          GGEN_URL: https://github.com/seanchatmangpt/ggen/releases/download/v26.8.6/ggen-x86_64-unknown-linux-gnu.tar.gz
          GGEN_SHA256: 4a8e957858423ae88e50278442c8c6bf5d44d24f8061774a911185cfe74ee469
        run: |
          curl --fail --location --silent --show-error "$GGEN_URL" --output /tmp/ggen.tar.gz
          echo "$GGEN_SHA256  /tmp/ggen.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/ggen-bin
          tar -xzf /tmp/ggen.tar.gz -C /tmp/ggen-bin
          GGEN_BIN="$(find /tmp/ggen-bin -type f -name ggen -perm -u+x | head -n 1)"
          test -n "$GGEN_BIN"
          echo "$(dirname "$GGEN_BIN")" >> "$GITHUB_PATH"
          "$GGEN_BIN" --version
      - name: Compile verifier surfaces
        run: python -m compileall -q scripts tests generated
      - name: Execute exact ggen projection
        shell: bash
        run: |
          set +e
          ggen sync run 2>&1 | tee /tmp/ggen-sync.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            diagnostic="$(head -c 6000 /tmp/ggen-sync.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=ggen sync failed::$diagnostic"
          fi
          exit "$status"
      - name: Refuse generated drift
        run: git diff --exit-code -- generated
      - name: Verify independent reference correspondence
        run: python scripts/render_reference.py --check
      - name: Execute ontology verifier
        run: python scripts/verify_ontology.py
      - name: Execute falsifier suite
        run: python -m pytest -q
