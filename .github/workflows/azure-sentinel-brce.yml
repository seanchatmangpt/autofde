name: AutoFDE Azure Sentinel BRCE adapter

on:
  pull_request:
    paths:
      - "src/autofde/sentinel.py"
      - "src/autofde/azure.py"
      - "src/autofde/runtime.py"
      - "tests/test_sentinel.py"
      - "tests/test_runtime.py"
      - ".github/workflows/azure-sentinel-brce.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-sentinel-brce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Refuse subject drift
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$expected" || {
            echo "REFUSED:EXACT_HEAD_MISMATCH expected=$expected observed=$observed" >&2
            exit 1
          }
          echo "AUTOFDE_SENTINEL_EXACT_HEAD=$observed"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile Sentinel production boundary
        run: |
          python -m py_compile \
            src/autofde/runtime.py \
            src/autofde/azure.py \
            src/autofde/sentinel.py \
            tests/test_runtime.py \
            tests/test_sentinel.py

      - name: Execute real-HTTP BRCE and runtime court
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v \
            tests/test_runtime.py \
            tests/test_sentinel.py

      - name: Refuse alternate consequence mechanisms
        shell: bash
        run: |
          set -euo pipefail
          file=src/autofde/sentinel.py
          if grep -En 'subprocess|os\.system|requests\.|httpx\.|azure\.mgmt|terraform|kubectl|gcloud|aws[[:space:]]|az[[:space:]]' "$file"; then
            echo 'REFUSED:SENTINEL_ALTERNATE_EFFECT_TRANSPORT' >&2
            exit 1
          fi
          grep -q '"If-Match": expected_etag' "$file" || {
            echo 'REFUSED:SENTINEL_OPTIMISTIC_CONCURRENCY_MISSING' >&2
            exit 1
          }
          grep -q 'response.status != 200' "$file" || {
            echo 'REFUSED:SENTINEL_UPDATE_ONLY_STATUS_FENCE_MISSING' >&2
            exit 1
          }
          grep -q 'Independent GET-based postcondition verifier' "$file" || {
            echo 'REFUSED:SENTINEL_INDEPENDENT_VERIFIER_MISSING' >&2
            exit 1
          }
          echo 'AUTOFDE_SENTINEL_EFFECT_SURFACE_BOUNDED=ALIVE'

      - name: Execute repository Python falsifier suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Emit bounded standing
        run: |
          echo 'AUTOFDE_SENTINEL_BRCE_ADAPTER=ALIVE'
          echo 'AUTOFDE_LIVE_AZURE_SENTINEL=BLOCKED:LIVE_AZURE_AUTHORITY'
